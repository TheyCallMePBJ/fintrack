spring.application.name=fintrack

# MariaDB connection
# Credentials are read from environment variables so they are never committed:
#   DB_USERNAME  - MariaDB user (required)
#   DB_PASSWORD  - MariaDB password (required)
#   DB_URL       - optional, defaults to the local "fintrack" schema
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/fintrack}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
